[project]
name = "lunar-align-x-backend"
version = "0.1.0"
description = "Lunar-Align-X backend - ISRO SIH26166 (100% Dynamic, all models)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pds4-tools>=1.4",
  "scipy>=1.14",
  "requests>=2.31",
  "torch>=2.4",
  "kornia>=0.8",
  "timm>=1.0",
  "einops>=0.8",
]

[project.optional-dependencies]
cpu = ["torch>=2.4", "kornia>=0.8", "timm>=1.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
